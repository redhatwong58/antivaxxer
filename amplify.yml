# AWS Amplify Build Specification — ANTIVAXXER Frontend
#
# [AV-042] feat: AWS Amplify deployment configuration
#
# Monorepo setup: this file lives at the repo root.
# Amplify is configured with appRoot=frontend in the console, so
# all paths in the frontend section are relative to /frontend.
#
# Environment variables are sourced from:
#   - Plain text vars: Amplify Console → App settings → Environment variables
#     (NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY, NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SITE_URL,
#      NEXT_PUBLIC_TURNSTILE_SITE_KEY, NEXT_PUBLIC_GA4_ID, NEXT_PUBLIC_COOKIESYES_ID,
#      NEXTAUTH_URL)
#   - Secrets via SSM: Amplify Console references AWS Secrets Manager
#     Required secret:
#       - antivaxxer/prod/nextauth-secret  → NEXTAUTH_SECRET
#
# To rollback: delete this file. Amplify will fall back to auto-detected
# Next.js settings, which work but lose Prisma generation.

version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - echo "Node version:"
            - node --version
            - echo "Installing dependencies..."
            - npm ci
            - echo "Generating Prisma client (frontend imports types)..."
            - cd ../api && npx prisma generate && cd ../frontend
        build:
          commands:
            - echo "Building Next.js production bundle..."
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
