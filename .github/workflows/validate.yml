# GitHub Actions — PR Validation
#
# [AV-042] feat: PR validation before merge
#
# Runs on every pull request and push to main.
# Catches issues before they reach Amplify/App Runner.
#
# Checks:
#   1. JS syntax across the entire repo
#   2. Prisma schema validation
#   3. Next.js production build
#   4. API server starts without crashing
#
# Does NOT check:
#   - Database migrations against real DB (would need staging RDS)
#   - End-to-end tests (none exist yet)
#   - Visual regression (none configured)

name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Single install for workspaces (lockfile is at repo root). Per-package `npm ci`
      # skips hoisted devDependencies and causes `npx prisma` to fetch Prisma 7+.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run db:generate --workspace=api

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm exec --workspace=api -- prisma validate

      - name: JS syntax check (all files)
        run: |
          FAILED=0
          for f in $(find api frontend shared -name "*.js" -not -path "*/node_modules/*" -not -path "*/.next/*"); do
            if ! node --check "$f" 2>/dev/null; then
              echo "✗ Syntax error: $f"
              node --check "$f"
              FAILED=$((FAILED+1))
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "::error::$FAILED files failed syntax check"
            exit 1
          fi
          echo "✓ All JS files passed syntax check"

      - name: Build Next.js frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: validation-secret-not-real
        run: npm run build

      - name: API server smoke test
        working-directory: api
        env:
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
          NEXTAUTH_SECRET: validation-secret-not-real
          STRIPE_SECRET_KEY: sk_test_validation
          STRIPE_WEBHOOK_SECRET: whsec_validation
        run: |
          timeout 8 node src/index.js &
          sleep 4
          curl -f http://localhost:4000/api/health || echo "Health check returned non-200 (expected without real DB)"
          pkill -f "node src/index.js" || true
          echo "✓ API server starts without crashing"
